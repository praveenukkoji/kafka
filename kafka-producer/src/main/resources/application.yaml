server:
    port: ${PORT}

spring:
    application:
        name: kafka-producer
    jpa:
        database: postgresql
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate.format_sql: true
    datasource:
        driver-class-name: org.postgresql.Driver
        url: ${DB_URL}/${DB_NAME}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}